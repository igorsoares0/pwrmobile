include: package:flutter_lints/flutter.yaml

# Native analysis server plugins. riverpod_lint 3.1+ is installed here rather
# than as a dev_dependency.
plugins:
  riverpod_lint: ^3.1.8

analyzer:
  errors:
    # Generated files are formatted by their builders, not by us.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Generated by `flutter gen-l10n` from lib/l10n/*.arb.
    - "lib/l10n/app_localizations*.dart"

linter:
  rules:
    # The set-logging path is rebuilt constantly; const widgets keep it cheap.
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # Offline-first means a lot of async work runs while the user keeps
    # tapping. These catch the classic "widget is gone by now" bugs.
    use_build_context_synchronously: true
    unawaited_futures: true

    always_declare_return_types: true
    avoid_redundant_argument_values: true
    prefer_single_quotes: true
    require_trailing_commas: true
    unnecessary_parenthesis: true
